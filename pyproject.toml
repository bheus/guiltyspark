[project]
name = "guiltyspark"
version = "0.1.0"
description = "Agentic Loki log monitor for homelabs and application fleets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
guiltyspark = "guiltyspark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guiltyspark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
