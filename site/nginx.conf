server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # llms.txt and the page copy carry typographic UTF-8; label it explicitly so
    # agents and crawlers do not have to guess an encoding.
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Internet scanners routinely request secrets and repository metadata.
    # Return a quiet 404 before Nginx attempts to read these paths.
    location ~ /\.(?!well-known(?:/|$)) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # add_header does not inherit into a location that declares its own, so the
    # baseline headers are repeated in each block below.

    # Icons and preview art change only on redeploy.
    location ~* \.(?:png|ico|svg)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Agent- and crawler-facing metadata: cached briefly so edits propagate.
    location ~* ^/(?:llms\.txt|robots\.txt|sitemap\.xml)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
