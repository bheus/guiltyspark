server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Internet scanners routinely request secrets and repository metadata.
    # Return a quiet 404 before Nginx attempts to read these paths.
    location ~ /\.(?!well-known(?:/|$)) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
