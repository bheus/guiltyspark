name: CI and release

on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request-title:
    name: Validate release type
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            style
            test

  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build

  release:
    name: Release and deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out full history
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Create semantic release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==10.5.3 semantic-release version --no-changelog

      - name: Read released version
        if: steps.release.outputs.released == 'true'
        id: version
        run: echo "version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.release.outputs.released == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bheus/guiltyspark:${{ steps.version.outputs.version }}
            ghcr.io/bheus/guiltyspark:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin released image for Portainer
        if: steps.release.outputs.released == 'true'
        run: |
          # Commit the exact image only after GHCR has it, so Portainer never
          # redeploys (via poll or webhook) before the released image exists.
          sed -i -E "s#ghcr\\.io/bheus/guiltyspark:[^}[:space:]]+#ghcr.io/bheus/guiltyspark:${{ steps.version.outputs.version }}#" docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git commit -m "chore(deploy): v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:refs/heads/main

      - name: Trigger Portainer redeploy
        if: steps.release.outputs.released == 'true'
        env:
          PORTAINER_GUILTYSPARK_WEBHOOK: ${{ secrets.PORTAINER_GUILTYSPARK_WEBHOOK }}
        run: |
          # No-op until the secret is configured (see Homelab Services.md for the
          # Portainer GitOps webhook, exposed via the deploy.builtbybrendan.com
          # Cloudflare Tunnel hostname, mirroring the Abraham stack's setup).
          if [ -z "$PORTAINER_GUILTYSPARK_WEBHOOK" ]; then
            echo "PORTAINER_GUILTYSPARK_WEBHOOK not set; skipping webhook trigger, relying on Portainer's poll interval."
            exit 0
          fi
          curl -fsS -X POST "$PORTAINER_GUILTYSPARK_WEBHOOK"
