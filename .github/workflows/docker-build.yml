name: Docker image build

# The release job only builds the image after a release is cut, so a broken
# Dockerfile or base-image bump would otherwise merge green and fail at deploy.
# Billed minutes: only Dependabot's bumps are checked here; human changes to the
# image are expected to be built locally before pushing.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - pyproject.toml
      - uv.lock
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/docker-build.yml

concurrency:
  group: docker-build-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build image
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # Matches the release platform, so the build is native rather than emulated.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          tags: guiltyspark:ci
          cache-from: type=gha

      - name: Smoke-test CLI
        run: docker run --rm --entrypoint guiltyspark guiltyspark:ci --help
