version: 2
updates:
  # Prefixes decide what semantic-release ships. Dependabot gives security
  # updates the same prefix as routine bumps of that ecosystem, so anything that
  # lands in an image is "fix" (cuts a release and redeploys). Dev dependencies
  # and actions never reach an image, so "chore"/"ci" keep them from releasing.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    open-pull-requests-limit: 3
    groups:
      # react-dom requires the same react major as a peer, so bumping either alone fails npm ci.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/plugin-react"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: docker
    directory: /site
    schedule:
      interval: weekly
      day: sunday
    commit-message:
      prefix: fix
      include: scope
