version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      # react-dom requires the same react major as a peer, so bumping either alone fails npm ci.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /site
    schedule:
      interval: weekly
      day: sunday
