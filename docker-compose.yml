services:
  guiltyspark:
    image: ${GUILTYSPARK_IMAGE:-ghcr.io/bheus/guiltyspark:latest}
    container_name: guiltyspark
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - CODEX_HOME=/data/codex
      - GUILTYSPARK_STATE_PATH=/data/guiltyspark.sqlite3
      - GUILTYSPARK_FINDINGS_PATH=/data/findings.jsonl
      - GUILTYSPARK_REMEDIATION_ROOT=/data/remediation
      - GUILTYSPARK_TARGETS_JSON=${GUILTYSPARK_TARGETS_JSON:-}
      - LOKI_URL=${LOKI_URL:-http://host.docker.internal:3100}
      - LOKI_QUERY=${LOKI_QUERY:-{job=~".+"}}
      - LOKI_LIMIT=${LOKI_LIMIT:-5000}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_APP_PRIVATE_KEY_FILE=${GITHUB_APP_PRIVATE_KEY_FILE:-}
      - LOKI_BEARER_TOKEN=${LOKI_BEARER_TOKEN:-}
      - LOKI_BASIC_AUTH=${LOKI_BASIC_AUTH:-}
      - GUILTYSPARK_NOTIFY_WEBHOOK_URL=${GUILTYSPARK_NOTIFY_WEBHOOK_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GUILTYSPARK_NOTIFY_EMAIL_FROM=${GUILTYSPARK_NOTIFY_EMAIL_FROM:-}
      - GUILTYSPARK_NOTIFY_EMAIL_TO=${GUILTYSPARK_NOTIFY_EMAIL_TO:-}
      - GUILTYSPARK_PR_MODE=${GUILTYSPARK_PR_MODE:-off}
      - GUILTYSPARK_MODEL=${GUILTYSPARK_MODEL:-}
      - GUILTYSPARK_ANALYSIS_MODEL=${GUILTYSPARK_ANALYSIS_MODEL:-}
      - GUILTYSPARK_REMEDIATION_MODEL=${GUILTYSPARK_REMEDIATION_MODEL:-gpt-5.6-luna}
      - GUILTYSPARK_CODEX_PATH=${GUILTYSPARK_CODEX_PATH:-codex}
      - GUILTYSPARK_CODEX_WORKDIR=${GUILTYSPARK_CODEX_WORKDIR:-/app}
      - GUILTYSPARK_CODEX_TIMEOUT_SECONDS=${GUILTYSPARK_CODEX_TIMEOUT_SECONDS:-600}
      - GUILTYSPARK_INTERVAL_SECONDS=${GUILTYSPARK_INTERVAL_SECONDS:-300}
      - GUILTYSPARK_LOOKBACK_SECONDS=${GUILTYSPARK_LOOKBACK_SECONDS:-900}
      - GUILTYSPARK_MIN_EVENTS=${GUILTYSPARK_MIN_EVENTS:-2}
      - GUILTYSPARK_MAX_INCIDENTS_PER_RUN=${GUILTYSPARK_MAX_INCIDENTS_PER_RUN:-8}
      - GUILTYSPARK_DEDUP_ISSUES=${GUILTYSPARK_DEDUP_ISSUES:-true}
      - GUILTYSPARK_ISSUE_COOLDOWN_SECONDS=${GUILTYSPARK_ISSUE_COOLDOWN_SECONDS:-604800}
      - GUILTYSPARK_ISSUE_ACTIVE_WINDOW_SECONDS=${GUILTYSPARK_ISSUE_ACTIVE_WINDOW_SECONDS:-1209600}
      - GUILTYSPARK_EXPECTED_LOGS_CACHE_SECONDS=${GUILTYSPARK_EXPECTED_LOGS_CACHE_SECONDS:-300}
      - GUILTYSPARK_GITHUB_API_URL=${GUILTYSPARK_GITHUB_API_URL:-https://api.github.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Codex uses bubblewrap to sandbox remediation workspaces. On Docker hosts
    # without unprivileged user namespaces, bubblewrap needs these container
    # permissions to create its own isolated namespace.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - guiltyspark-data:/data
    healthcheck:
      test: ["CMD", "guiltyspark", "--help"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 30s

  guiltyspark-dashboard:
    image: ${GUILTYSPARK_IMAGE:-ghcr.io/bheus/guiltyspark:latest}
    container_name: guiltyspark-dashboard
    restart: unless-stopped
    command: ["guiltyspark", "dashboard"]
    env_file:
      - path: .env
        required: false
    environment:
      - GUILTYSPARK_STATE_PATH=/data/guiltyspark.sqlite3
      - GUILTYSPARK_FINDINGS_PATH=/data/findings.jsonl
      - GUILTYSPARK_TARGETS_JSON=${GUILTYSPARK_TARGETS_JSON:-}
      - LOKI_URL=${LOKI_URL:-http://host.docker.internal:3100}
      - LOKI_QUERY=${LOKI_QUERY:-{job=~".+"}}
      - LOKI_LIMIT=${LOKI_LIMIT:-5000}
      - LOKI_BEARER_TOKEN=${LOKI_BEARER_TOKEN:-}
      - LOKI_BASIC_AUTH=${LOKI_BASIC_AUTH:-}
      - GUILTYSPARK_DASHBOARD_HOST=${GUILTYSPARK_DASHBOARD_HOST:-0.0.0.0}
      - GUILTYSPARK_DASHBOARD_PORT=${GUILTYSPARK_DASHBOARD_PORT:-8343}
      - GUILTYSPARK_DASHBOARD_GROUPING=${GUILTYSPARK_DASHBOARD_GROUPING:-false}
      - GUILTYSPARK_MODEL=${GUILTYSPARK_MODEL:-}
      - GUILTYSPARK_ANALYSIS_MODEL=${GUILTYSPARK_ANALYSIS_MODEL:-}
      - GUILTYSPARK_REMEDIATION_MODEL=${GUILTYSPARK_REMEDIATION_MODEL:-gpt-5.6-luna}
      - GUILTYSPARK_CODEX_PATH=${GUILTYSPARK_CODEX_PATH:-codex}
      - GUILTYSPARK_CODEX_WORKDIR=${GUILTYSPARK_CODEX_WORKDIR:-/app}
      - GUILTYSPARK_CODEX_TIMEOUT_SECONDS=${GUILTYSPARK_CODEX_TIMEOUT_SECONDS:-600}
      - GUILTYSPARK_GITHUB_API_URL=${GUILTYSPARK_GITHUB_API_URL:-https://api.github.com}
      # Needed to read live PR dispositions, including in private repositories.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_APP_PRIVATE_KEY_FILE=${GITHUB_APP_PRIVATE_KEY_FILE:-}
    ports:
      - "${GUILTYSPARK_DASHBOARD_PORT:-8343}:${GUILTYSPARK_DASHBOARD_PORT:-8343}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - guiltyspark-data:/data

  guiltyspark-site:
    image: ${GUILTYSPARK_SITE_IMAGE:-ghcr.io/bheus/guiltyspark-site:latest}
    container_name: guiltyspark-site
    restart: unless-stopped
    ports:
      - "${GUILTYSPARK_SITE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  guiltyspark-data:
    name: guiltyspark-data
